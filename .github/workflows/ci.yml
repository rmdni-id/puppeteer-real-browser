name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run ESM tests
        run: npm run esm_test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        timeout-minutes: 20

      - name: Run CJS tests
        run: npm run cjs_test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        timeout-minutes: 20
